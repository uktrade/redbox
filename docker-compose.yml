services:
  redbox-django-app:
    image: redbox-django-app:latest
    container_name: django_app
    build:
      context: .
      dockerfile: ./django_app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      sso:
        condition: service_started
    networks:
      - redbox-app-network
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - /app/django_app/frontend/node_modules
      - ./django_app:/app/django_app/
      - .aws:/root/.aws
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: curl --fail http://localhost:${PORT:-8080}/health/ || exit 1
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 60s

  db:
    image: postgres:15
    container_name: db
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    volumes:
      - local_postgres_data:/var/lib/postgresql/data:Z
    networks:
      - redbox-app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s
  requirements:
    image: python:3.12
    profiles:
      - utils
    volumes:
      - ./:/app/:z
  redbox-worker:
    image: redbox-worker:latest
    container_name: worker
    build:
      context: .
      dockerfile: django_app/Dockerfile
    command: "venv/bin/django-admin qcluster"
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    volumes:
      - .aws:/root/.aws
    depends_on:
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redbox-django-app:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - redbox-app-network
    restart: unless-stopped
  minio:
    image: minio/minio
    container_name: minio
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    entrypoint: sh
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command:
      - -c
      - |
        mkdir -p data/${BUCKET_NAME}
        minio server --console-address ":9001" /data
    networks:
      - redbox-app-network
    volumes:
      - ./data/objectstore:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true  # Disable security plugin for simplicity
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD} # Sets the demo admin user password when using demo configuration (for OpenSearch 2.12 and later)
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - redbox-app-network
    healthcheck:
      test: curl --fail http://localhost:9200/_cluster/health || exit 1
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 60s
    restart: unless-stopped
  opensearch-dashboards:
    # Make sure the version of opensearch-dashboards matches the version of opensearch installed on other nodes
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch_dashboards
    ports:
      # Map host port 5601 to container port 5601
      - 5601:5601
    expose:
      # Expose port 5601 for web access to OpenSearch Dashboards
      - "5601"
    environment:
      # Define the OpenSearch nodes that OpenSearch Dashboards will query
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - redbox-app-network
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  sso:
    image: public.ecr.aws/uktrade/mock-sso:branch-main
    container_name: sso
    environment:
      - MOCK_SSO_PORT=8001
      - MOCK_SSO_TOKEN=local.token
      - MOCK_SSO_CODE=local.code
    ports:
      - "8001:8001"
    networks:
      - redbox-app-network

networks:
  redbox-app-network:
    driver: bridge
    name: redbox-app-network

volumes:
  opensearch-data:
  redbox-app-data:
  local_postgres_data: {}
