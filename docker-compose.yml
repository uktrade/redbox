services:
  redbox-django-app:
    image: redbox-django-app:latest
    container_name: django_app
    build:
      context: .
      dockerfile: ./django_app/Dockerfile
      args:
        INSTALL_DEV: "true"
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      sso:
        condition: service_started
    networks:
      - redbox-app-network
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=local
      - PYTHONUNBUFFERED=1
      - DEBUGPY=1
      - AWS_PROFILE=redbox
    volumes:
      - ./django_app:/usr/src/app
      - ./redbox/redbox:/usr/src/app/redbox
      - ./logs:/usr/src/app/logs
      - ${HOME}/.aws:/root/.aws
      - /usr/src/app/frontend/node_modules
      - /usr/src/app/staticfiles
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "5678:5678"
    healthcheck:
      test: curl --fail http://localhost:${PORT:-8080}/health/ || exit 1
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 60s

  redbox-worker:
    image: redbox-worker:latest
    container_name: worker
    build:
      context: .
      dockerfile: django_app/Dockerfile
      args:
        INSTALL_DEV: "true"
    command: >
      watchmedo auto-restart
      --directory=/usr/src/app --pattern='*.py' --recursive
      --ignore-patterns='*/.venv/*;*/venv/*;*/node_modules/*;*/staticfiles/*;*/__pycache__/*;*/test-results/*;*/migrations/*'
      --debug-force-polling
      -- django-admin qcluster
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=local
      - PYTHONUNBUFFERED=1
      - AWS_PROFILE=redbox
    volumes:
      - ./django_app:/usr/src/app
      - ./redbox/redbox:/usr/src/app/redbox
      - ./logs:/usr/src/app/logs
      - ${HOME}/.aws:/root/.aws:ro
      - /usr/src/app/frontend/node_modules
      - /usr/src/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - redbox-app-network

  frontend-watch:
    image: node:20
    container_name: frontend_watch
    working_dir: /src
    command: sh -c "npm ci && npx parcel watch"
    volumes:
      - ./django_app/frontend:/src
    networks:
      - redbox-app-network

  db:
    image: postgres:15
    container_name: db
    env_file:
      - path: tests/.env.integration
        required: false
      - path: .env
        required: false
    volumes:
      - local_postgres_data:/var/lib/postgresql/data:Z
    networks:
      - redbox-app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 30s

  requirements:
    image: python:3.12
    profiles:
      - utils
    volumes:
      - ./:/app/:z

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true  # Disable security plugin for simplicity
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - redbox-app-network
    healthcheck:
      test: curl --fail http://localhost:9200/_cluster/health || exit 1
      interval: 5s
      timeout: 30s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch_dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - redbox-app-network
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  sso:
    image: public.ecr.aws/uktrade/mock-sso:branch-main
    container_name: sso
    environment:
      - MOCK_SSO_PORT=8001
      - MOCK_SSO_TOKEN=local.token
      - MOCK_SSO_CODE=local.code
    ports:
      - "8001:8001"
    networks:
      - redbox-app-network

networks:
  redbox-app-network:
    driver: bridge
    name: redbox-app-network

volumes:
  opensearch-data:
  redbox-app-data:
  local_postgres_data: {}
