service: export_support
prompt_version: export-support-v1
questions:
  - id: cptpp_001
    question: "What is the estimated long-run annual increase in UK GDP from CPTPP accession?"
    reference: "Accession to CPTPP is estimated to increase long-run UK GDP by £2.0 billion per year compared to projected levels in 2040."
  - id: cptpp_002
    question: "How many countries are current CPTPP members?"
    reference: "CPTPP currently has 11 members: Australia, Brunei, Canada, Chile, Japan, Malaysia, Mexico, New Zealand, Peru, Singapore and Vietnam."
  - id: cptpp_003
    question: "What percentage of UK goods exports will be eligible for tariff-free trade under CPTPP?"
    reference: "Over 99% of current UK goods exports to CPTPP members will be eligible for tariff-free trade."
  - id: cptpp_004
    question: "What is the combined GDP of all CPTPP member economies?"
    reference: "CPTPP members had a joint GDP of £9 trillion in 2022."
  - id: cptpp_005
    question: "By how much is bilateral trade between the UK and CPTPP members expected to increase?"
    reference: "Bilateral trade between the UK and all CPTPP countries is expected to increase by £4.9 billion (3.9%)."
  - id: cptpp_006
    question: "What is the estimated impact of CPTPP on real take-home pay for UK workers?"
    reference: "Real take-home pay for UK workers is estimated to increase by around 0.1%, equivalent to approximately £1.0 billion."
  - id: cptpp_007
    question: "What is the estimated annual reduction in tariff duties on current UK exports under CPTPP?"
    reference: "UK exporters are estimated to save around £119 million annually in tariff duties on current UK exports."
  - id: cptpp_008
    question: "What is the estimated increase in global greenhouse gas emissions from UK accession to CPTPP?"
    reference: "Global greenhouse gas emissions could increase by around 1.03 MtCO2e (0.003%) as a result of UK accession to CPTPP."
  - id: cptpp_009
    question: "What tariff does Malaysia currently charge on UK whisky exports, and what will it be reduced to under CPTPP?"
    reference: "Malaysia currently charges approximately 80% tariff on UK whisky exports. Under CPTPP, this will be reduced to 0% within 10 years."
  - id: cptpp_010
    question: "Which UK regions see the largest percentage GDP increase from CPTPP accession?"
    reference: "The West Midlands and East Midlands are estimated to see the largest percentage GDP increases from CPTPP accession."
