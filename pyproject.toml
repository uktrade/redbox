[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.poetry]
name = "redbox-root"
version = "0.4.0"
description = "RAG application that uses GenAI to chat with and summarise civil service documents"
authors = [
    "DBT Redbox <redbox@businessandtrade.gov.uk>",
    "i.AI <i-dot-ai-enquiries@cabinetoffice.gov.uk>",
]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pre-commit = "^4.7.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.format]
exclude = ["django_app/redbox_app/redbox_core/migrations/*.py"]

[tool.ruff.lint]
# Dribble in those we have commented out, asterisked ones first
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ARG",
    "ASYNC",
    "BLE",
    "COM",
    "DJ",
    "DTZ",
    "EM",
    "EXE",
    "FURB",
    "ICN",
    "INT",
    "ISC",
    "LOG",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "SLOT",
    "TCH",
    "TD",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
exclude = ["django_app/redbox_app/redbox_core/migrations/*.py", "out/*", "worker/*"]
ignore = ["COM812", "DJ001", "RET505", "RET508", "PLR0913", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["redbox_app", "redbox", "core_api", "src", "worker"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003", "S311"]
"*/tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003"]
"django_app/tests_playwright/*" = [
    "S101",
    "S106",
    "PLR0913",
    "PLR2004",
    "TD003",
]
"worker/*" = ["TCH003","B008"]
"worker/tests/*" = ["ARG001","SLF001", "PT019", "PT011"]
"redbox/*" = ["TCH003"]
"redbox/tests/*" = ["ARG001"]
"*/admin.py" = ["RUF012"]
"*/models.py" = ["RUF012"]
