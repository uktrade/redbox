[tool.poetry]
name = "worker"
version = "0.0.1"
description = ""
authors = [
    "DBT Assist <assist@businessandtrade.gov.uk>",
]
license = "MIT"
package-mode=false

[tool.poetry.dependencies]
redbox = { path = "../redbox", develop = true }
python = ">=3.12,<3.13"
django = "^6.0.4"
django-q2 = "^1.9.0"
django-storages = "^1.14.2"
boto3 = "^1.42.88"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.2"
blessed = "^1.38.0"
unstructured = { version = "^0.27.32", extras = ["all-docs"] }
transformers = "^5.10.1"
torch = "<2.13" # Pinned due to issues with poetry dependency resolution of nvidia-cublas package
cuda-toolkit = "<13" # Pinned due to issues with poetry dependency resolution of nvidia-cublas package
python-slugify = "^8.0.4"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
