[tool.poetry]
name = "worker"
version = "0.0.1"
description = ""
authors = [
    "DBT Assist <assist@businessandtrade.gov.uk>",
]
license = "MIT"
package-mode=false

[tool.poetry.dependencies]
redbox = { path = "../redbox", develop = true }
python = ">=3.12,<3.13"
boto3 = "^1.42.88"
blessed = "^1.38.0"
unstructured = { version = "^0.27.32", extras = ["all-docs"] }
transformers = "^5.10.1"
torch = "<2.13" # Pinned due to issues with poetry dependency resolution of nvidia-cublas package
cuda-toolkit = "<13" # Pinned due to issues with poetry dependency resolution of nvidia-cublas package
python-slugify = "^8.0.4"
fonttools = "<4.69"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-dotenv = "^0.5.2"
pytest-django = "^4.12.0"
pytest-env = "^1.2.0"
pytest-cov = "^5.0.0"
requests-mock = "^1.12.1"
moto = "^5.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.evaluation]
optional = true

[tool.poetry.group.evaluation.dependencies]
ragas = "^0.4.4"
PyYAML = "^6.0.2"
litellm = "^1.110.2"

[tool.pytest.ini_options]
env_override_existing_values = 1
env_files = ["tests/.env.test", ".env"]
markers = [
    "ai: marks tests as using a live LLM (deselect with '-m \"not ai\"')",
]
