{% macro govukErrorSummary(title="There is a problem", error_list=[], heading_level=2, hidden=False) %}
  <div class="govuk-error-summary govuk-!-margin-top-3{% if hidden %} govuk-!-display-none{% endif %}" data-module="govuk-error-summary">
    <div role="alert">
      <h{{ heading_level }} class="govuk-error-summary__title">
        {{ title }}
      </h{{ heading_level }}>
      <div class="govuk-error-summary__body">
        <ul class="govuk-list govuk-error-summary__list data-text">
          {% for error in error_list %}
            <li>{{error}}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
{% endmacro %}
